<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Loop Classifier Benchmark</title>
  <desc id="desc">Six classifier scenarios, the combined score formula, and the planned three-axis model comparison.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#192c43"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#49dcb1"/><stop offset="1" stop-color="#66a9ff"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#eef5ff}.muted{fill:#9db0c9}.label{font-size:18px;font-weight:700;letter-spacing:1.5px}.head{font-size:43px;font-weight:750}.sub{font-size:22px}.cardhead{font-size:23px;font-weight:700}.body{font-size:17px}.metric{font-size:20px;font-weight:700}.small{font-size:15px}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
  <rect x="64" y="56" width="9" height="116" rx="4" fill="url(#accent)"/>
  <text x="98" y="83" class="label" fill="#68dfbb">AGENTIC LOOP · CLASSIFIER BENCHMARK</text>
  <text x="98" y="137" class="head">Fast decisions. Measured end to end.</text>
  <text x="98" y="178" class="sub muted">Сравнение точности, цены и полной задержки на одном наборе решений</text>

  <text x="72" y="240" class="label muted">6 КЛАССИФИКАЦИОННЫХ СЦЕНАРИЕВ</text>
  <g transform="translate(72 267)">
    <g><rect width="460" height="135" rx="18" fill="#20344c" stroke="#34506d"/><circle cx="37" cy="38" r="19" fill="#49dcb1"/><text x="37" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#102338">01</text><text x="72" y="43" class="cardhead">Tool selector</text><text x="28" y="82" class="body muted">Какой инструмент нужен — или не нужен вовсе</text><text x="28" y="111" class="small" fill="#7fe8c9">ВЫБРАТЬ ИНСТРУМЕНТ</text></g>
    <g transform="translate(480)"><rect width="460" height="135" rx="18" fill="#20344c" stroke="#34506d"/><circle cx="37" cy="38" r="19" fill="#66a9ff"/><text x="37" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#102338">02</text><text x="72" y="43" class="cardhead">Model router</text><text x="28" y="82" class="body muted">Быстрая, сильная, vision или code модель</text><text x="28" y="111" class="small" fill="#9cc5ff">НАПРАВИТЬ ЗАПРОС</text></g>
    <g transform="translate(960)"><rect width="460" height="135" rx="18" fill="#20344c" stroke="#34506d"/><circle cx="37" cy="38" r="19" fill="#ffbd69"/><text x="37" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#102338">03</text><text x="72" y="43" class="cardhead">Guardrails</text><text x="28" y="82" class="body muted">Разрешить, отказать, уточнить или эскалировать</text><text x="28" y="111" class="small" fill="#ffd294">ПРОВЕРИТЬ ГРАНИЦЫ</text></g>
    <g transform="translate(0 152)"><rect width="460" height="135" rx="18" fill="#20344c" stroke="#34506d"/><circle cx="37" cy="38" r="19" fill="#c59cff"/><text x="37" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#102338">04</text><text x="72" y="43" class="cardhead">Delegation router</text><text x="28" y="82" class="body muted">Самому, специалисту или нескольким агентам?</text><text x="28" y="111" class="small" fill="#d8baff">ВЫБРАТЬ МАРШРУТ РАБОТЫ</text></g>
    <g transform="translate(480 152)"><rect width="460" height="135" rx="18" fill="#20344c" stroke="#34506d"/><circle cx="37" cy="38" r="19" fill="#ff8291"/><text x="37" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#102338">05</text><text x="72" y="43" class="cardhead">Confidence &amp; escalation</text><text x="28" y="82" class="body muted">Автоматизировать, уточнить или позвать человека</text><text x="28" y="111" class="small" fill="#ffadb7">ОЦЕНИТЬ УВЕРЕННОСТЬ</text></g>
    <g transform="translate(960 152)"><rect width="460" height="135" rx="18" fill="#20344c" stroke="#34506d"/><circle cx="37" cy="38" r="19" fill="#b7d96c"/><text x="37" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#102338">06</text><text x="72" y="43" class="cardhead">Stop or continue</text><text x="28" y="82" class="body muted">Закончить, повторить действие или спросить</text><text x="28" y="111" class="small" fill="#cfe99a">ВЫБРАТЬ СЛЕДУЮЩИЙ ШАГ</text></g>
  </g>

  <rect x="72" y="592" width="880" height="300" rx="22" fill="#17283d" stroke="#34506d"/>
  <text x="106" y="638" class="label muted">ОДИН SCORE ДЛЯ ВСЕХ СЦЕНАРИЕВ</text>
  <text x="106" y="701" font-size="35" font-weight="700">Score = Accuracy × Cost factor × Latency factor</text>
  <text x="106" y="758" class="metric" fill="#75e2bf">Cost factor</text><text x="275" y="758" class="sub">1 / (1 + √(cost / $0.001))</text>
  <text x="106" y="802" class="metric" fill="#89b8ff">Latency factor</text><text x="275" y="802" class="sub">1 / (1 + (max(0, ms − 500) / 1000)²)</text>
  <text x="106" y="858" class="small muted">Штраф задержки начинается после 500 ms · end-to-end request + response</text>

  <rect x="980" y="592" width="548" height="300" rx="22" fill="#17283d" stroke="#34506d"/>
  <text x="1016" y="638" class="label muted">СРАВНЕНИЕ МОДЕЛЕЙ</text>
  <text x="1016" y="686" class="metric">Ось Y · точность</text><text x="1016" y="722" class="metric">Ось X · цена вызова</text><text x="1016" y="758" class="metric">Цвет · задержка</text>
  <path d="M1040 839H1465M1040 839V785" fill="none" stroke="#7890aa" stroke-width="2"/>
  <path d="M1085 818L1184 807L1273 815L1366 790L1435 798" fill="none" stroke="#49dcb1" stroke-width="3"/>
  <circle cx="1085" cy="818" r="7" fill="#49dcb1"/><circle cx="1184" cy="807" r="7" fill="#66a9ff"/><circle cx="1273" cy="815" r="7" fill="#ffbd69"/><circle cx="1366" cy="790" r="7" fill="#c59cff"/><circle cx="1435" cy="798" r="7" fill="#ff8291"/>
  <text x="1035" y="873" class="small muted">Схема сравнения · точки появятся после замеров</text>
  <text x="72" y="949" class="small muted">Модели: OpenAI · Anthropic · Google · xAI · DeepSeek · Qwen · Jev / TypeSafe</text>
</svg>
